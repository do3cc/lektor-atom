[build-system]
requires = ["hatchling>=1.13.0,<2.0.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lektor-atom"
description = "Lektor plugin that generates Atom feeds."
keywords = ["Lektor", "plugin", "static-site", "blog", "atom", "rss"]
version = "0.4.0"
readme = "README.md"
authors = [
    {name = "A. Jesse Jiryu Davis", email = "jesse@emptysquare.net"},
]
requires-python = ">=3.8"
license-expression = "MIT"
classifiers = [
    "Environment :: Plugins",
    "Environment :: Web Environment",
    "Framework :: Lektor",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "MarkupSafe",
    "feedgenerator",
    "tox>=4.24.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "lektor",
    "lxml"

    ]
[project.urls]
Homepage = "https://github.com/lektor/lektor-atom"

[project.entry-points."lektor.plugins"]
atom = "lektor_atom:AtomPlugin"

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    ]

################################################################
#
# pylint
#
[tool.pylint.main]
ignore = [".git"]
load-plugins = "pylint.extensions.no_self_use"
extension-pkg-allow-list = "lxml"

[tool.pylint.format]
max-line-length = 91
max-module-lines = 2000

[tool.pylint."messages control"]
disable = [
    "missing-docstring",
]


[tool.tox]
requires = ["tox>=4.22"]
env_list = [
    "3.14",
    "3.13",
    "3.12",
    "3.11",
    "3.10",
    "3.9",
    "3.8",
]

[tool.tox.env_run_base]
description = "Run test under {base_python}"
dependency_groups = [
    "dev",
]
commands = [["pytest"]]
